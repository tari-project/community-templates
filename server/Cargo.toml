[package]
name = "ootle-community-templates"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
tari_ootle_template_metadata = { version = "0.16.0", features = ["json"] }
tari_engine_types = "0.47.0"
tari_crypto = "0.24.1"

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
blake2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jsonwebtoken = "9.3.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "json", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.9.12"
url = "2.5.8"
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }